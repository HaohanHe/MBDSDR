<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MBDSDR 手机端 - AI 定义无线电</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "MiSans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: #faf9f7;
    color: #3d3a36;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* 顶部状态栏 */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; margin-bottom: 16px;
    border-bottom: 1px solid #e8e6e1;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: #3d3a36; }
  .header .subtitle { font-size: 11px; color: #9a958d; margin-top: 2px; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #c8c6c1; display: inline-block; margin-right: 6px;
  }
  .status-dot.connected { background: #7a9e7e; }
  .status-dot.connecting { background: #c4a882; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-text { font-size: 12px; color: #6b665f; }

  /* 卡片 */
  .card {
    background: #ffffff; border: 1px solid #e8e6e1; border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: #3d3a36;
    margin-bottom: 10px; display: flex; align-items: center;
  }
  .card-title .icon { margin-right: 6px; font-size: 14px; }

  /* 连接配置 */
  .input-group { margin-bottom: 10px; }
  .input-group label { display: block; font-size: 11px; color: #6b665f; margin-bottom: 4px; }
  .input-group input {
    width: 100%; padding: 8px 12px; border: 1px solid #d8d6d1; border-radius: 6px;
    font-size: 13px; color: #3d3a36; background: #faf9f7;
  }
  .input-group input:focus { outline: none; border-color: #7a9e7e; background: #fff; }
  .btn {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-primary { background: #7a9e7e; color: #fff; }
  .btn-primary:hover { background: #5a7e5e; }
  .btn-primary:disabled { background: #c8c6c1; cursor: not-allowed; }
  .btn-secondary { background: #f5f4f0; color: #6b665f; border: 1px solid #d8d6d1; }
  .btn-secondary:hover { background: #e8e6e1; }
  .btn-danger { background: #f5f0f0; color: #a06060; border: 1px solid #e0d0d0; }
  .btn-danger:hover { background: #f0e8e8; }

  /* 指令卡片 */
  .instruction-card {
    border-left: 3px solid #7a9e7e; padding-left: 12px; margin-bottom: 12px;
  }
  .instruction-card.pending { border-left-color: #c8c6c1; }
  .instruction-card.in_progress { border-left-color: #c4a882; }
  .instruction-card.completed { border-left-color: #7a9e7e; opacity: 0.7; }
  .instruction-card.failed { border-left-color: #c07070; }
  .instruction-goal { font-size: 14px; font-weight: 600; color: #3d3a36; margin-bottom: 4px; }
  .instruction-reason { font-size: 12px; color: #6b665f; margin-bottom: 8px; }
  .step-list { list-style: none; }
  .step-item {
    display: flex; align-items: flex-start; padding: 6px 0;
    font-size: 12px; color: #6b665f;
  }
  .step-status {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; margin-right: 8px; flex-shrink: 0;
  }
  .step-status.pending { background: #f0eee9; color: #9a958d; }
  .step-status.in_progress { background: #f5efe5; color: #c4a882; }
  .step-status.completed { background: #e8f0e9; color: #7a9e7e; }
  .step-status.failed { background: #f5e8e8; color: #c07070; }
  .step-text { flex: 1; line-height: 1.4; }

  /* AR 指引 */
  .ar-container {
    position: relative; width: 100%; aspect-ratio: 1;
    background: #f5f4f0; border-radius: 10px; overflow: hidden;
    border: 1px solid #e8e6e1;
  }
  .ar-compass {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80%; height: 80%;
  }
  .ar-ring {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid #d8d6d1; border-radius: 50%;
  }
  .ar-ring.r1 { width: 30%; height: 30%; }
  .ar-ring.r2 { width: 60%; height: 60%; }
  .ar-ring.r3 { width: 90%; height: 90%; }
  .ar-crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 24px; height: 24px;
  }
  .ar-crosshair::before, .ar-crosshair::after {
    content: ''; position: absolute; background: #7a9e7e;
  }
  .ar-crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  .ar-crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
  .ar-arrow {
    position: absolute; top: 50%; left: 50%;
    width: 4px; height: 35%;
    background: linear-gradient(to top, #c4a882, #d4b892);
    transform-origin: bottom center;
    border-radius: 2px;
    transition: transform 0.3s ease;
  }
  .ar-arrow::after {
    content: ''; position: absolute; top: -8px; left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-bottom: 12px solid #c4a882;
  }
  .ar-label {
    position: absolute; font-size: 11px; color: #6b665f;
    background: rgba(255,255,255,0.9); padding: 2px 6px; border-radius: 4px;
  }
  .ar-label.n { top: 8px; left: 50%; transform: translateX(-50%); }
  .ar-label.s { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .ar-label.e { right: 8px; top: 50%; transform: translateY(-50%); }
  .ar-label.w { left: 8px; top: 50%; transform: translateY(-50%); }
  .ar-info {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between;
    font-size: 11px; color: #6b665f;
    background: rgba(255,255,255,0.95); padding: 6px 10px; border-radius: 6px;
  }

  /* 传感器数据 */
  .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sensor-item {
    background: #faf9f7; border: 1px solid #e8e6e1; border-radius: 6px;
    padding: 8px; text-align: center;
  }
  .sensor-label { font-size: 10px; color: #9a958d; margin-bottom: 2px; }
  .sensor-value { font-size: 14px; font-weight: 600; color: #3d3a36; }
  .sensor-unit { font-size: 10px; color: #9a958d; font-weight: 400; }

  /* 进度条 */
  .progress-bar {
    width: 100%; height: 6px; background: #f0eee9; border-radius: 3px;
    overflow: hidden; margin: 8px 0;
  }
  .progress-fill {
    height: 100%; background: #7a9e7e; border-radius: 3px;
    transition: width 0.3s ease;
  }
  .progress-text { font-size: 11px; color: #6b665f; text-align: center; }

  /* 空状态 */
  .empty-state {
    text-align: center; padding: 40px 20px; color: #9a958d;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state .text { font-size: 13px; line-height: 1.6; }

  /* 底部操作栏 */
  .action-bar {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .action-bar .btn { flex: 1; }

  /* 日志 */
  .log-container {
    background: #1d1d1f; color: #e8e6e1; border-radius: 8px;
    padding: 10px; font-family: "SF Mono", "Consolas", monospace;
    font-size: 11px; max-height: 150px; overflow-y: auto;
    line-height: 1.5;
  }
  .log-line { margin-bottom: 2px; }
  .log-line .time { color: #7a9e7e; }
  .log-line .msg { color: #e8e6e1; }

  /* 隐藏类 */
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部状态栏 -->
  <div class="header">
    <div>
      <h1>MBDSDR 手机端</h1>
      <div class="subtitle">AI 定义无线电 · 双端协同</div>
    </div>
    <div style="text-align: right;">
      <div><span class="status-dot" id="statusDot"></span><span class="status-text" id="statusText">未连接</span></div>
    </div>
  </div>

  <!-- 连接配置（未连接时显示） -->
  <div id="connectPanel" class="card">
    <div class="card-title"><span class="icon">⚙</span>连接配置</div>
    <div class="input-group">
      <label>电脑端地址</label>
      <input type="text" id="serverUrl" value="ws://192.168.1.100:7993" placeholder="ws://IP:7993">
    </div>
    <div class="input-group">
      <label>设备名称</label>
      <input type="text" id="deviceName" value="我的手机" placeholder="给这台手机起个名字">
    </div>
    <button class="btn btn-primary" id="connectBtn" onclick="connect()">连接电脑端</button>
  </div>

  <!-- 主界面（已连接时显示） -->
  <div id="mainPanel" class="hidden">
    <!-- 当前指令 -->
    <div class="card" id="currentInstructionCard">
      <div class="card-title"><span class="icon">🎯</span>当前指令</div>
      <div id="currentInstruction">
        <div class="empty-state">
          <div class="icon">📋</div>
          <div class="text">等待 AI 下发指令<br><span style="font-size:11px;color:#c8c6c1;">当 AI 遇到需要物理操作的任务时，会自动将操作指令推送到这里</span></div>
        </div>
      </div>
    </div>

    <!-- AR 指引 -->
    <div class="card" id="arCard">
      <div class="card-title"><span class="icon">🧭</span>AR 空间指引</div>
      <div class="ar-container">
        <div class="ar-ring r1"></div>
        <div class="ar-ring r2"></div>
        <div class="ar-ring r3"></div>
        <div class="ar-crosshair"></div>
        <div class="ar-arrow" id="arArrow" style="transform: translate(-50%, -100%) rotate(0deg); transform-origin: bottom center;"></div>
        <div class="ar-label n">北</div>
        <div class="ar-label s">南</div>
        <div class="ar-label e">东</div>
        <div class="ar-label w">西</div>
        <div class="ar-info">
          <span>方位: <strong id="arAz">0°</strong></span>
          <span>仰角: <strong id="arEl">0°</strong></span>
          <span>对准: <strong id="arAlign">0%</strong></span>
        </div>
      </div>
    </div>

    <!-- 传感器数据 -->
    <div class="card">
      <div class="card-title"><span class="icon">📡</span>传感器状态</div>
      <div class="sensor-grid">
        <div class="sensor-item">
          <div class="sensor-label">GPS 纬度</div>
          <div class="sensor-value" id="gpsLat">--</div>
        </div>
        <div class="sensor-item">
          <div class="sensor-label">GPS 经度</div>
          <div class="sensor-value" id="gpsLon">--</div>
        </div>
        <div class="sensor-item">
          <div class="sensor-label">罗盘方位</div>
          <div class="sensor-value" id="compass">--<span class="sensor-unit">°</span></div>
        </div>
        <div class="sensor-item">
          <div class="sensor-label">IMU 倾角</div>
          <div class="sensor-value" id="imu">--<span class="sensor-unit">°</span></div>
        </div>
      </div>
    </div>

    <!-- 对准进度 -->
    <div class="card">
      <div class="card-title"><span class="icon">📊</span>对准进度</div>
      <div class="progress-bar"><div class="progress-fill" id="alignProgress" style="width: 0%"></div></div>
      <div class="progress-text" id="alignText">等待指令...</div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
      <button class="btn btn-primary" id="startBtn" onclick="startExecution()">开始执行</button>
      <button class="btn btn-secondary" id="completeBtn" onclick="completeStep()">完成当前步骤</button>
      <button class="btn btn-danger" onclick="cancelInstruction()">取消</button>
    </div>

    <!-- 历史指令 -->
    <div class="card" style="margin-top: 12px;">
      <div class="card-title"><span class="icon">📜</span>历史指令</div>
      <div id="historyList">
        <div class="empty-state" style="padding: 20px;">
          <div class="text" style="font-size:12px;">暂无历史指令</div>
        </div>
      </div>
    </div>

    <!-- 日志 -->
    <div class="card">
      <div class="card-title"><span class="icon">📝</span>通信日志</div>
      <div class="log-container" id="logContainer"></div>
    </div>

    <!-- 断开连接 -->
    <button class="btn btn-secondary" style="margin-top: 12px;" onclick="disconnect()">断开连接</button>
  </div>
</div>

<script>
// 全局状态
let ws = null;
let deviceId = 'mobile_' + Math.random().toString(36).substr(2, 9);
let currentInstruction = null;
let currentStepIndex = 0;
let history = [];
let sensorWatchId = null;

// 日志
function log(msg) {
  const container = document.getElementById('logContainer');
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="time">[${time}]</span> <span class="msg">${msg}</span>`;
  container.appendChild(line);
  container.scrollTop = container.scrollHeight;
}

// 连接
function connect() {
  const url = document.getElementById('serverUrl').value;
  const name = document.getElementById('deviceName').value;
  const btn = document.getElementById('connectBtn');

  btn.disabled = true;
  btn.textContent = '连接中...';
  updateStatus('connecting', '连接中...');

  try {
    ws = new WebSocket(url);

    ws.onopen = () => {
      log('WebSocket 已连接');
      // 发送握手
      const handshake = {
        type: 'handshake',
        id: deviceId,
        timestamp: Date.now(),
        source: 'mobile',
        payload: {
          device_id: deviceId,
          device_name: name,
          platform: 'web',
          capabilities: {
            has_gps: true,
            has_compass: true,
            has_imu: true,
            has_camera: true,
            has_ar: true,
            has_sdr: false,
            ar_mode: '3dof'
          }
        }
      };
      ws.send(JSON.stringify(handshake));
      log('已发送握手');
      updateStatus('connected', '已连接');
      document.getElementById('connectPanel').classList.add('hidden');
      document.getElementById('mainPanel').classList.remove('hidden');
      startSensors();
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleMessage(msg);
      } catch (e) {
        log('消息解析失败: ' + e.message);
      }
    };

    ws.onclose = () => {
      log('WebSocket 已断开');
      updateStatus('disconnected', '未连接');
      document.getElementById('connectPanel').classList.remove('hidden');
      document.getElementById('mainPanel').classList.add('hidden');
      btn.disabled = false;
      btn.textContent = '连接电脑端';
      stopSensors();
    };

    ws.onerror = (e) => {
      log('WebSocket 错误');
      updateStatus('disconnected', '连接失败');
      btn.disabled = false;
      btn.textContent = '连接电脑端';
    };
  } catch (e) {
    log('连接异常: ' + e.message);
    btn.disabled = false;
    btn.textContent = '连接电脑端';
  }
}

// 断开
function disconnect() {
  if (ws) {
    ws.close();
  }
}

// 处理消息
function handleMessage(msg) {
  log('收到: ' + msg.type);

  if (msg.type === 'instruction') {
    currentInstruction = msg.payload;
    currentStepIndex = 0;
    renderInstruction();
    updateAR();
  } else if (msg.type === 'instruction_cancelled') {
    currentInstruction = null;
    renderInstruction();
    updateAR();
  } else if (msg.type === 'status_update') {
    // 电脑端状态更新
  } else if (msg.type === 'ping') {
    // 心跳
    ws.send(JSON.stringify({ type: 'pong', id: msg.id, timestamp: Date.now(), source: 'mobile' }));
  }
}

// 渲染当前指令
function renderInstruction() {
  const container = document.getElementById('currentInstruction');

  if (!currentInstruction) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <div class="text">等待 AI 下发指令<br><span style="font-size:11px;color:#c8c6c1;">当 AI 遇到需要物理操作的任务时，会自动将操作指令推送到这里</span></div>
      </div>`;
    return;
  }

  const instr = currentInstruction;
  const statusClass = instr.status || 'pending';

  let stepsHtml = '';
  if (instr.steps && instr.steps.length > 0) {
    stepsHtml = '<ul class="step-list">';
    instr.steps.forEach((step, idx) => {
      const stepStatus = step.status || 'pending';
      const statusSymbol = stepStatus === 'completed' ? '✓' :
                           stepStatus === 'in_progress' ? '…' :
                           stepStatus === 'failed' ? '✗' : '○';
      stepsHtml += `
        <li class="step-item">
          <div class="step-status ${stepStatus}">${statusSymbol}</div>
          <div class="step-text">${step.description || step.text || '步骤 ' + (idx + 1)}</div>
        </li>`;
    });
    stepsHtml += '</ul>';
  }

  container.innerHTML = `
    <div class="instruction-card ${statusClass}">
      <div class="instruction-goal">${instr.goal || '未命名指令'}</div>
      <div class="instruction-reason">${instr.reason || 'AI 判定需要人工操作'}</div>
      ${stepsHtml}
      ${instr.ar_guidance ? `<div style="font-size:11px;color:#9a958d;margin-top:8px;">AR 指引: 方位 ${instr.ar_guidance.target_azimuth || 0}° / 仰角 ${instr.ar_guidance.target_elevation || 0}°</div>` : ''}
    </div>`;
}

// 更新 AR 指引
function updateAR() {
  if (!currentInstruction || !currentInstruction.ar_guidance) {
    document.getElementById('arArrow').style.transform = 'translate(-50%, -100%) rotate(0deg)';
    document.getElementById('arAz').textContent = '0°';
    document.getElementById('arEl').textContent = '0°';
    document.getElementById('arAlign').textContent = '0%';
    return;
  }

  const az = currentInstruction.ar_guidance.target_azimuth || 0;
  const el = currentInstruction.ar_guidance.target_elevation || 0;
  document.getElementById('arArrow').style.transform = `translate(-50%, -100%) rotate(${az}deg)`;
  document.getElementById('arAz').textContent = az.toFixed(1) + '°';
  document.getElementById('arEl').textContent = el.toFixed(1) + '°';

  // 模拟对准进度（实际应从传感器计算）
  const align = Math.min(100, Math.max(0, 100 - Math.abs(az - (window.compassHeading || 0))));
  document.getElementById('arAlign').textContent = align.toFixed(0) + '%';
  document.getElementById('alignProgress').style.width = align + '%';
  document.getElementById('alignText').textContent = align > 90 ? '已对准！' : '请将手机指向目标方向...';
}

// 开始执行
function startExecution() {
  if (!currentInstruction) return;
  currentStepIndex = 0;
  if (currentInstruction.steps && currentInstruction.steps.length > 0) {
    currentInstruction.steps[0].status = 'in_progress';
  }
  currentInstruction.status = 'in_progress';
  renderInstruction();
  sendStatus('in_progress', '开始执行');
  log('开始执行指令');
}

// 完成当前步骤
function completeStep() {
  if (!currentInstruction || !currentInstruction.steps) return;

  if (currentStepIndex < currentInstruction.steps.length) {
    currentInstruction.steps[currentStepIndex].status = 'completed';
    currentStepIndex++;

    if (currentStepIndex < currentInstruction.steps.length) {
      currentInstruction.steps[currentStepIndex].status = 'in_progress';
      sendStatus('in_progress', `步骤 ${currentStepIndex}/${currentInstruction.steps.length} 完成`);
    } else {
      currentInstruction.status = 'completed';
      sendStatus('completed', '全部步骤完成');
      addToHistory(currentInstruction);
      log('指令全部完成');
    }
  }
  renderInstruction();
}

// 取消指令
function cancelInstruction() {
  if (!currentInstruction) return;
  currentInstruction.status = 'cancelled';
  sendStatus('cancelled', '用户取消');
  addToHistory(currentInstruction);
  currentInstruction = null;
  renderInstruction();
  updateAR();
  log('指令已取消');
}

// 发送状态
function sendStatus(status, message) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const msg = {
    type: 'status_update',
    id: 'status_' + Date.now(),
    timestamp: Date.now(),
    source: 'mobile',
    payload: {
      instruction_id: currentInstruction ? currentInstruction.id : null,
      status: status,
      message: message,
      current_step: currentStepIndex,
      sensors: getSensorData()
    }
  };
  ws.send(JSON.stringify(msg));
}

// 添加到历史
function addToHistory(instr) {
  history.unshift({
    goal: instr.goal,
    status: instr.status,
    time: new Date().toLocaleTimeString()
  });
  renderHistory();
}

// 渲染历史
function renderHistory() {
  const container = document.getElementById('historyList');
  if (history.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="text" style="font-size:12px;">暂无历史指令</div></div>';
    return;
  }
  container.innerHTML = history.map(h => `
    <div style="padding:8px 0;border-bottom:1px solid #f0eee9;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#3d3a36;">${h.goal}</span>
      <span style="font-size:11px;color:${h.status === 'completed' ? '#7a9e7e' : h.status === 'cancelled' ? '#c07070' : '#c4a882'};">${h.status} · ${h.time}</span>
    </div>
  `).join('');
}

// 传感器
function startSensors() {
  // GPS
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition((pos) => {
      document.getElementById('gpsLat').textContent = pos.coords.latitude.toFixed(4);
      document.getElementById('gpsLon').textContent = pos.coords.longitude.toFixed(4);
    }, null, { enableHighAccuracy: true });
  }

  // 罗盘（DeviceOrientation）
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      const heading = e.alpha || 0;
      window.compassHeading = heading;
      document.getElementById('compass').innerHTML = heading.toFixed(0) + '<span class="sensor-unit">°</span>';
      document.getElementById('imu').innerHTML = (e.beta || 0).toFixed(0) + '<span class="sensor-unit">°</span>';
      updateAR();
    });
  }
}

function stopSensors() {
  if (sensorWatchId) {
    navigator.geolocation.clearWatch(sensorWatchId);
  }
}

function getSensorData() {
  return {
    gps: {
      lat: parseFloat(document.getElementById('gpsLat').textContent) || 0,
      lon: parseFloat(document.getElementById('gpsLon').textContent) || 0
    },
    compass: window.compassHeading || 0,
    imu: {
      pitch: parseFloat(document.getElementById('imu').textContent) || 0
    }
  };
}

// 状态更新
function updateStatus(status, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + status;
  txt.textContent = text;
}

// 初始化
log('MBDSDR 手机端已启动');
log('请输入电脑端 WebSocket 地址并连接');
</script>
