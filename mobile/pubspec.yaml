name: mbdsdr_mobile
description: MBDSDR 原生手机端（Flutter）——AI 指挥、人架手机转天线对星的随身 SDR 终端。
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:      # 官方 gen-l10n 本地化支撑（Material/Widgets 全局 delegate）
    sdk: flutter
  provider: ^6.1.5            # 状态管理
  fftea: ^1.5.0               # 真实 FFT（rtl_tcp IQ -> 频谱）
  geolocator: ^14.1.1         # 真实 GPS 定位
  flutter_compass: ^0.8.1     # 真实罗盘朝向
  sensors_plus: ^7.1.0        # 真实 IMU
  shared_preferences: ^2.5.5  # 设置持久化
  flutter_secure_storage: ^11.2.0  # API key 安全存储（加密、不落仓库）
  path_provider: ^2.1.0       # 应用文档目录（真实录音落盘落点）
  intl: any                   # 与 flutter_localizations 锁定的 intl 对齐（官方 i18n 模板做法），锁文件定死具体版本

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0          # 单测里用虚拟时间推进重连退避

flutter:
  uses-material-design: true
  # 官方 gen-l10n：pub get / run / test 时按 l10n.yaml 生成 AppLocalizations
  # 到 lib/l10n/gen/（生成进源码目录，非 synthetic package）。
  generate: true
