# 官方 gen-l10n 配置（不要自制字典/字符串扩展类，文案一律走这里）。
#
# 源语言 = 简体中文（app_zh.arb 为模板，zh 是既有界面文案的真值）；
# en / ja 为翻译档。生成物输出到源码目录 lib/l10n/gen/：
# Flutter 3.32+ 已废弃 synthetic package（package:flutter_gen），
# 3.35+ 该选项被移除，因此这里不写 synthetic-package，直接指定 output-dir。
arb-dir: lib/l10n
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/gen
# of(context) 返回可空（AppLocalizations.of(context)! 与之配套），显式钉死默认值，
# 避免不同 Flutter 版本默认漂移引发 unnecessary_non_null_assertion。
nullable-getter: true
