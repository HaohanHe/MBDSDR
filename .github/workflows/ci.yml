# =============================================================================
# MBDSDR 持续集成（CI）
# -----------------------------------------------------------------------------
# 状态：结构就绪 —— 本文件在云内编写，未经 runner 实测，待配置验证。
#       三个 job（cpp / flutter / python）的 checkout + setup + test 步骤已按
#       本地实测命令组织；首次在 GitHub runner 上跑通前，需按下方注释补齐
#       runner 环境（尤其 C++ 的 Qt 6.8 与系统图形库）。标注为 TODO(runner) 处
#       即"待 runner 配置验证"项；详见 docs/learn/phase40/ci-notes.md 的上 runner
#       检查清单。
#
# 安全：本 workflow 不使用任何 secrets / API key / 凭据；硬件相关用例在无硬件
#       runner 上由 pytest / Qt 自行 skip，不计失败。
# =============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一 ref 的新提交取消旧的排队运行，省 runner 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python：pytest 五个根目录
  #
  # runner 要求（本地实测基线，首次接 runner 时据此核对）：
  #   - 解释器：Python 3.12（本地 3.12.11；setup-python '3.12' 已对齐）。
  #   - pytest：仅用标准能力（fixture/raises/mark.parametrize/skipif/skip/
  #     importorskip），无需 pytest-qt / pytest-timeout / pytest-xdist 等
  #     第三方插件；直接 `pip install pytest` 即可。
  #   - 业务依赖：见根 requirements.txt 与 desktop/requirements.txt，核心为
  #     numpy / scipy / requests / websocket-client / websockets / sgp4 /
  #     skyfield / pymap3d / pyserial / Pillow / sounddevice + PySide6(>=6.5)。
  #     硬件相关库（SoapySDR、pyrtlsdr 等）可选，装不上不应让 CI 崩，故下方
  #     `pip install -r requirements.txt || true` 容错。
  #   - PySide6 offscreen 系统库：libgl1 libegl1 libxkbcommon0 libdbus-1-3
  #     （见下方 apt 步骤）；运行时须设 QT_QPA_PLATFORM=offscreen。
  #
  # 无硬件/无历表环境下：硬件用例由 pytest 自行 skip（importorskip/skipif）；
  #   test_solar_system 因 de421.bsp 未下载而 skip（属预期，非失败）。
  # 无音频环境下：runner 无 PulseAudio/ALSA 默认输出设备（本步骤也不装音频服务），
  #   sounddevice 可 import 但 query_devices() 为空；依赖真实声卡的用例
  #   （AudioPlayer / 解调后回放类）由测试代码按"无设备即 skip 并写明原因"处理，
  #   不计失败——与本地 scripts/run_all_tests.sh 的 SKIP 语义一致。
  # 墙钟：本地脚本对每个 pytest 根目录套 `timeout -k 20 900`（PYTEST_TIMEOUT=900）
  #   防卡死用例；CI 侧用 job 级 timeout-minutes 兜底（GitHub 默认 360min 太长）。
  # 已知不稳定项：根 tests/ 大套件顺序相关、单例 QApplication 累积导致部分
  #   UI 用例慢/偶发失败或墙钟超时，详见 docs/learn/phase10/P4-stability.md；
  #   runner 上若该目录超时，按该文档排查，勿据此扩大其它 job。
  # ---------------------------------------------------------------------------
  python:
    name: pytest (${{ matrix.root }}${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # 按根拆并行：快的四个根各自独立完成；根 tests/ 拆成 A/B 两个并行
      # job（按文件名排序交替分组，见 scripts/ci_pytest_groups.py）——它整跑
      # 本地约 48 分钟（慢在跨文件的单例 QApplication 累积），拆开后每组
      # 约一半，墙钟与累积影响都减半。
      # fail-fast: false ——一个根失败不应取消其他根的结果。
      fail-fast: false
      matrix:
        include:
          - root: mbdsdr_ai/tests
            timeout: 20
            label: ""
          - root: experiments/tests
            timeout: 20
            label: ""
          - root: tools/onboarding
            timeout: 20
            label: ""
          - root: tools/hw_selfcheck
            timeout: 20
            label: ""
          # 根 tests/ 是大套件（200 个测试文件：test_*.py / *_test.py /
          # *roundtrip*.py 三种命名，分组脚本自动收件）：跨文件的单例 QApplication
          # 累积是主要耗时，整跑本地约 48 分钟（CI 侧历史实测约 40 分钟），
          # 45 分钟的 job 上限余量太薄。故拆成 A/B 两个并行 job：按文件名
          # 排序交替分组（scripts/ci_pytest_groups.py 自动生成，无需维护
          # 清单），各自独立进程，墙钟约为一半、累积影响也减半。
          # timeout 是防挂死上限而非预算（Actions 按实际运行分钟计费）。
          - root: tests/
            timeout: 45
            group: 0
            label: " (A)"
          - root: tests/
            timeout: 45
            group: 1
            label: " (B)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 系统图形库（PySide6 offscreen 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 核心依赖；个别可选硬件库（SoapySDR 等）装不上不应让 CI 直接崩，故 || true
          pip install -r requirements.txt || true
          # 桌面端依赖（PySide6>=6.5 等）——根 requirements.txt 不含 PySide6，
          # pytest 套件里 offscreen 用例直接 import PySide6，缺了会整批 skip 而非真跑。
          # 该文件内全部为 manylinux 可装 wheel，无需 || true。
          pip install -r desktop/requirements.txt
          # 实验层依赖（matplotlib，Agg 绘图）——experiments/tests 经
          # experiments.common.plot 传递 import，缺了会在 pytest 收集阶段
          # 整批 ImportError（CI 首跑实测三个测试文件挂在此）。
          pip install -r experiments/requirements.txt
          pip install pytest

      - name: pytest (${{ matrix.root }}${{ matrix.label }})
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # 根 tests/ 拆成两组并行跑（见 scripts/ci_pytest_groups.py）：
          # 按文件名排序交替分组，各自独立进程——墙钟约为整跑一半，
          # 且跨文件的单例 QApplication 累积影响减半。
          if [ -n "${{ matrix.group }}" ]; then
            python scripts/ci_pytest_groups.py --check
            files=$(python scripts/ci_pytest_groups.py \
                      --group "${{ matrix.group }}" --total 2)
            # shellcheck disable=SC2086
            python -m pytest -q $files
          else
            python -m pytest -q "${{ matrix.root }}"
          fi

  # ---------------------------------------------------------------------------
  # Flutter：test + analyze
  #
  # runner 要求：
  #   - Flutter SDK：stable 通道，版本钉到本地实测基线 3.47.5（Dart 3.13.4）。
  #   - SDK 路径：subosito/flutter-action@v2 会把指定版本下载到 runner 缓存并
  #     自动把 `flutter` 加入 PATH，无需手写 FLUTTER_ROOT；本地开发机的 SDK
  #     在 /home/user/tools/flutter（见 scripts/run_all_tests.sh 的 FLUTTER_BIN），
  #     CI 不依赖该绝对路径。
  #   - 工程目录：mobile/（working-directory 已在此设置）。
  #   - 步骤：flutter pub get → flutter analyze → flutter test；均无需凭据。
  # ---------------------------------------------------------------------------
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: 依赖解析
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  # ---------------------------------------------------------------------------
  # C++：cmake 构建 + Qt offscreen ctest
  #
  # runner 要求 —— Qt 6.8 安装方式（本地基线 Qt 6.8.2，前缀 /home/user/Qt/6.8.2/gcc_64）：
  #   ubuntu-latest apt 的 qt6-base-dev 版本通常低于 6.8，直接 `find_package(Qt6)`
  #   可能因版本/API 不匹配在 configure 阶段失败。首次接 runner 时二选一：
  #
  #   (推荐，无需 Qt 账号) 用 aqtinstall 装一份 Qt 6.8.2 到固定前缀，再把前缀
  #     传给 CMake——与本地开发机完全一致：
  #       pip install aqtinstall
  #       aqt install-qt linux desktop 6.8.2 gcc_64 \
  #           --outputdir "$HOME/Qt"        # -> $HOME/Qt/6.8.2/gcc_64
  #       cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
  #             -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.2/gcc_64"
  #     （本地即如此安装，见 aqtinstall.log；offscreen 跑 ctest 时把
  #       $HOME/Qt/6.8.2/gcc_64/lib 加入 LD_LIBRARY_PATH，并设 QT_QPA_PLATFORM=offscreen。）
  #
  #   (备选) jurplel/install-qt-action@v3：需 Qt 账户凭据（属 secrets，本仓库不
  #     内建），由维护者在 GitHub 仓库 Settings→Secrets 配置后再启用。
  #
  #   当前 workflow 默认走"apt 装 qt6-base-dev"——若 runner 上 apt 版 <6.8，此 job
  #   会在 configure 阶段失败，即"待 runner 配置验证"的明确信号；此时按上面
  #   (推荐) 用 aqtinstall 固定 6.8.2。
  #
  # 其它构建依赖：build-essential cmake ninja-build + qt6-multimedia-dev
  #   qt6-tools-dev + libgl1-mesa-dev（offscreen ctest 需要）。
  # ---------------------------------------------------------------------------
  cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 系统构建依赖 + Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-multimedia-dev qt6-tools-dev \
            libgl1-mesa-dev pkg-config

      - name: CMake 配置
        working-directory: cpp
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # OOM 提示：ubuntu-latest 内存有限，Qt 全量多目标并行 Release 构建可能被
      #   cgroup OOM kill。若此处 OOM：先降并行度 `cmake --build build -j2`，
      #   仍 OOM 则按单目标逐个构建 `cmake --build build --target <one>`。
      - name: 构建
        working-directory: cpp
        run: cmake --build build -j"$(nproc)"

      - name: ctest（offscreen，无显示）
        working-directory: cpp
        # 用 apt 装的 Qt6（/usr/lib）时无需 LD_LIBRARY_PATH；
        # 若按上面 (推荐) 切到 aqtinstall 固定 6.8.2，须在此 env 追加
        #   LD_LIBRARY_PATH: $HOME/Qt/6.8.2/gcc_64/lib
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
