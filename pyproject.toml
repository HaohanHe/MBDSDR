# SPDX-License-Identifier: MIT
# MBDSDR Python 打包元数据（缺口台账 P1「Python 无 lock/元数据」的元数据侧）。
# 口径：可 pip 安装的是 mbdsdr_ai 智能体内核包；仓库根的 mbdsdr_ai_mcp_server.py
# 等独立入口脚本与 tests/ 不进包。硬依赖只列主包导入链必需（numpy/scipy/
# requests），其余第三方按功能面进 optional-dependencies 分组，
# 依赖对账由 tests/test_pyproject_packaging.py 双向钉住。
# 版本单一事实源为 mbdsdr_ai/VERSION：本文件用 setuptools dynamic 读取，
# cpp/CMakeLists.txt 用 file(READ) 读取，Python 侧由 mbdsdr_ai/version.py 读取。
# tests/test_pyproject_packaging.py 钉住派生关系，禁止再写死版本字面量。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbdsdr-ai"
dynamic = ["version"]
description = "MBDSDR AI 智能体内核：LLM 工具面 / 工作流引擎 / 协议解码（AI-defined SDR）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MBDSDR contributors" }]
keywords = ["SDR", "MCP", "LLM", "radio", "DSP"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "requests",
]

# 懒加载/可选功能面：缺了不影响 mbdsdr_ai 主包导入，缺哪个只废哪条功能路径。
# 分组按功能面；系统级硬件绑定（SoapySDR / hackrf / uhd）不走 PyPI，靠
# apt/厂商渠道安装，见 tests/test_pyproject_packaging.py 的诚实豁免清单。
[project.optional-dependencies]
# pyrtlsdr>=0.4 hard-binds rtlsdr_set_dithering at import time, which the
# classic osmocom librtlsdr builds lack (AttributeError on RtlSdr()).
hardware = ["pyserial", "pyrtlsdr<0.4", "pylibiio", "pyvisa", "sounddevice"]
satellite = ["sgp4", "skyfield", "jplephem", "astropy"]
# product.cbor 元数据（可选增强）：satdump_integration 已做 try/except 降级，
# 缺 cbor2 只少「按 product.cbor 的 images 清单精确取图」，仍走文件名规则。
satdump = ["cbor2>=5.0"]
viz = ["matplotlib", "Pillow", "psutil"]
desktop = ["PySide6"]
llm = ["tiktoken"]
net = ["websocket-client", "websockets", "zstandard"]
configs = ["PyYAML"]  # frame_layout_tool 布局表 YAML 面（可选，缺失显式报错）
test = ["pytest"]

[project.urls]
Repository = "https://github.com/mbdsdr/mbdsdr"

[project.scripts]
mbdsdr-ai = "mbdsdr_ai.core.cli:main"

[tool.setuptools.packages.find]
include = ["mbdsdr_ai*"]
exclude = ["mbdsdr_ai.tests*"]

[tool.setuptools.package-data]
mbdsdr_ai = ["locale/*.json", "data/*.json", "data/*.npz", "VERSION"]

[tool.setuptools.dynamic]
version = {file = "mbdsdr_ai/VERSION"}

# 从仓库根跑 pytest 时的收集边界：仓库里可能残留一份 sdist 解压目录
# （文件名形如 mbdsdr_ai-<版本>/，内含整套旧 tests/），同名模块会顶掉真测试，
# 实测 499 个 import file mismatch，把权威全量直接打断在收集阶段。
# 显式排除非源码树；其余保留 pytest 默认 norecursedirs 口径。
[tool.pytest.ini_options]
norecursedirs = [
    "mbdsdr_ai-[0-9]*",
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules",
    "venv", "{arch}", "cpp/build", "cpp/build-local", "cmake-build-*",
]
